name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 기본값 'tools platform-tools' 중 'tools'는 구글 저장소에서 없어져서 설치 단계가 실패함
          packages: 'platform-tools'

      - name: Install npm dependencies
        run: npm install

      # 저장소 최상위의 index.html / manifest.json / sw.js / 아이콘들이
      # "진짜" 원본입니다 (GitHub Pages가 서빙하는 파일과 동일).
      # 여기서 그걸 그대로 www/ 안으로 복사해서 APK에도 항상 최신 내용이 들어가게 합니다.
      # → 이제 index.html은 저장소 최상위 것 하나만 관리하면 됩니다.
      - name: Copy latest web files into www/
        run: |
          mkdir -p www
          cp index.html www/index.html
          # 설정 화면 맨 아래에 표시할 빌드 정보 (예: APK #45 · 2026-11-27 04:10)
          sed -i "s/__SHIFTNOTE_BUILD__/APK #${{ github.run_number }} · $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')/" www/index.html
          cp manifest.json www/manifest.json || true
          cp sw.js www/sw.js || true
          cp icon-*.png www/ || true
          cp apple-touch-icon.png www/ || true

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 서명 키는 저장소가 아닌 GitHub Secrets에만 보관 (설정 → Secrets and variables → Actions)
      # 필요한 Secrets: SHIFTNOTE_KEYSTORE_BASE64, SHIFTNOTE_KEYSTORE_PASSWORD, SHIFTNOTE_KEY_ALIAS, SHIFTNOTE_KEY_PASSWORD
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SHIFTNOTE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SHIFTNOTE_KEYSTORE_BASE64 시크릿이 없습니다. 서명 키 없이 빌드하면 업데이트 설치가 안 되므로 중단합니다."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shiftnote.keystore"
          echo "SHIFTNOTE_KEYSTORE=$RUNNER_TEMP/shiftnote.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        env:
          CI_BUILD_NUMBER: ${{ github.run_number }}
          SHIFTNOTE_KEYSTORE_PASSWORD: ${{ secrets.SHIFTNOTE_KEYSTORE_PASSWORD }}
          SHIFTNOTE_KEY_ALIAS: ${{ secrets.SHIFTNOTE_KEY_ALIAS }}
          SHIFTNOTE_KEY_PASSWORD: ${{ secrets.SHIFTNOTE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: shift-note-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
